services:
  - type: web
    name: exe-level-up
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python Main.py
    envVars:
      - key: ADMIN_PASSWORD
        value: youadminpass
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: ZAPUPI_API_KEY
        sync: false
    autoDeploy: true
