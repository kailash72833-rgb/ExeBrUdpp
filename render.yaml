services:
  - type: web
    name: exe-level-up
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python Main.py
    envVars:
      # REQUIRED: strong admin password (8+ chars). The old default "youadminpass" is rejected.
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: MONGODB_CONNECTION_STRING_2
        sync: false
      - key: Key
        sync: false
      - key: ZAPUPI_API_KEY
        sync: false
      # Public URL of this site (used for the payment webhook + redirects). Use: https://www.levelupbot.site
      - key: APP_URL
        sync: false
      # Secret that signs payment webhooks. Any long random text.
      # Secret address of the admin page: https://www.levelupbot.site/<ADMIN_PATH> (8+ letters/numbers, keep it private)
      - key: ADMIN_PATH
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      # Optional: ZapUPI order-status URL, lets old/unsigned callbacks be double-checked
      - key: ZAPUPI_STATUS_URL
        sync: false
      # Number of reverse proxies in front of the app (Render / Railway = 1)
      - key: TRUSTED_PROXY_HOPS
        value: "1"
    autoDeploy: true
